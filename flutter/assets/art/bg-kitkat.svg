<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F1" />
      <stop offset="0.52" stop-color="#FFF4EC" />
      <stop offset="1" stop-color="#F7E8DF" />
    </linearGradient>
    <radialGradient id="berry-glow" cx="94%" cy="14%" r="66%">
      <stop offset="0" stop-color="#F3A3A1" stop-opacity="0.30" />
      <stop offset="1" stop-color="#F3A3A1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="caramel-glow" cx="4%" cy="96%" r="70%">
      <stop offset="0" stop-color="#E8B474" stop-opacity="0.22" />
      <stop offset="1" stop-color="#E8B474" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="center-clear" cx="48%" cy="42%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62" />
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="wafer-stripes" width="84" height="84" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="84" height="84" fill="none" />
      <rect width="14" height="84" fill="#B32634" fill-opacity="0.09" />
      <rect x="42" width="9" height="84" fill="#6C382C" fill-opacity="0.07" />
    </pattern>
    <radialGradient id="edge-mask" cx="50%" cy="48%" r="73%">
      <stop offset="0.42" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.78" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.58" />
    </radialGradient>
    <mask id="edge-fade">
      <rect width="1600" height="1200" fill="url(#edge-mask)" />
    </mask>
  </defs>
  <rect width="1600" height="1200" fill="url(#base)" />
  <rect width="1600" height="1200" fill="url(#berry-glow)" />
  <rect width="1600" height="1200" fill="url(#caramel-glow)" />
  <rect width="1600" height="1200" fill="url(#wafer-stripes)" mask="url(#edge-fade)" />
  <rect width="1600" height="1200" fill="url(#center-clear)" />
</svg>
