name: ember_flutter
description: Flutter UI module for Ember on Android phone and Android TV.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/ember-logo.png
    - assets/art/
    - assets/flags/
    - assets/icons/solar/
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
          weight: 400
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
  module:
    androidX: true
    androidPackage: com.soheil.ember.ember_flutter
    iosBundleIdentifier: com.soheil.ember.emberFlutter
