[package]
name = "ember-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "std", "Win32_Foundation", "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Com",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
