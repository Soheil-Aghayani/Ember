    <path d="M 256.0,77.0 L 304.2,195.7 L 431.9,204.8 L 334.0,287.3 L 364.7,411.7 L 256.0,344.0 L 147.3,411.7 L 178.0,287.3 L 80.1,204.8 L 207.8,195.7 Z" fill="url(#waffle)" stroke="#542A20" stroke-width="17" stroke-linejoin="round" />
