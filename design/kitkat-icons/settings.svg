<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ember KitKat Settings icon</title>
  <desc id="desc">Editable vector reconstruction of the Settings icon, with chocolate, wafer, and red wrapper details.</desc>
  <defs>
    <linearGradient id="chocolate" x1="0" y1="0" x2="0" y2="1">
