      <stop offset=".42" stop-color="#D8F2F0" stop-opacity=".08" />
      <stop offset=".68" stop-color="#FFFFFF" stop-opacity=".03" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".20" />
    </linearGradient>
    <linearGradient id="glass-rim" x1="0" y1="0" x2="1" y2="1">
