<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ember KitKat Servers icon</title>
  <desc id="desc">Editable vector reconstruction of the Servers icon, with chocolate, wafer, and red wrapper details.</desc>
  <defs>
    <linearGradient id="chocolate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A85A35" />
      <stop offset=".28" stop-color="#7D3F29" />
      <stop offset=".72" stop-color="#572A20" />
      <stop offset="1" stop-color="#3E201B" />
    </linearGradient>
    <linearGradient id="chocolate-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B4A31" />
      <stop offset=".48" stop-color="#673322" />
      <stop offset="1" stop-color="#47251E" />
    </linearGradient>
    <linearGradient id="wafer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C9" />
      <stop offset=".55" stop-color="#F7D995" />
      <stop offset="1" stop-color="#E9B861" />
    </linearGradient>
    <linearGradient id="red-wrapper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF343C" />
      <stop offset=".45" stop-color="#E8172C" />
      <stop offset="1" stop-color="#B70824" />
    </linearGradient>
    <linearGradient id="red-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5960" />
      <stop offset=".5" stop-color="#EF1E32" />
      <stop offset="1" stop-color="#B90A25" />
    </linearGradient>
    <linearGradient id="cream-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9E8" />
      <stop offset="1" stop-color="#F4DDAF" />
    </linearGradient>
    <pattern id="waffle" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="url(#wafer)" />
      <path d="M-12 12 L12 -12 M0 48 L48 0 M36 60 L60 36 M-12 36 L12 60 M0 0 L48 48 M36 -12 L60 12" fill="none" stroke="#D99C4B" stroke-width="4.2" opacity=".56" />
      <path d="M-12 14 L14 -12 M2 48 L48 2" fill="none" stroke="#FFF8E8" stroke-width="2.2" opacity=".82" />
    </pattern>
    <linearGradient id="glass-glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62" />
      <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".24" />
      <stop offset=".42" stop-color="#D8F2F0" stop-opacity=".08" />
      <stop offset=".68" stop-color="#FFFFFF" stop-opacity=".03" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".20" />
    </linearGradient>
    <linearGradient id="glass-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98" />
      <stop offset=".45" stop-color="#E9F7F5" stop-opacity=".62" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".88" />
    </linearGradient>
  </defs>
  <g id="servers" data-name="Servers">
    <ellipse cx="256" cy="440" rx="205" ry="16" fill="#6B3526" opacity=".12" />
    <g id="server-top">
      <rect x="48" y="96" width="416" height="158" rx="38" fill="url(#chocolate-face)" stroke="#4A251E" stroke-width="12" />
      <rect x="48" y="96" width="416" height="158" rx="38" fill="url(#glass-glaze)" opacity=".20" pointer-events="none" />
      <path d="M75 111 H353" stroke="url(#glass-rim)" stroke-width="9" stroke-linecap="round" opacity=".92" />
      <rect x="72" y="129" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="72" y="161" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="72" y="193" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="249" y="158" width="28" height="28" rx="9" fill="url(#red-wrapper)" stroke="#A60E22" stroke-width="3" />
      <rect x="294" y="158" width="28" height="28" rx="9" fill="#F9D994" stroke="#503027" stroke-width="4" />
      <rect x="339" y="158" width="28" height="28" rx="9" fill="#F9D994" stroke="#503027" stroke-width="4" />
      <path d="M390 104 H428 L454 124 L441 143 L457 161 L441 179 L457 197 L441 216 L454 237 L428 247 H390 Z" fill="url(#red-wrapper)" stroke="#A60E22" stroke-width="5" stroke-linejoin="round" />
      <path d="M402 112 Q426 128 400 145 Q425 160 402 178 Q425 194 401 212 Q421 228 399 241" fill="none" stroke="#FFF1D7" stroke-width="10" opacity=".92" />
    </g>
    <g id="server-bottom">
