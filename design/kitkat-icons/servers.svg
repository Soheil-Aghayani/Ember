      <rect x="48" y="268" width="416" height="158" rx="38" fill="url(#glass-glaze)" opacity=".20" pointer-events="none" />
      <path d="M75 283 H353" stroke="url(#glass-rim)" stroke-width="9" stroke-linecap="round" opacity=".92" />
      <rect x="72" y="301" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="72" y="333" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="72" y="365" width="151" height="25" rx="10" fill="url(#waffle)" stroke="#4B271F" stroke-width="5" />
      <rect x="249" y="330" width="28" height="28" rx="9" fill="url(#red-wrapper)" stroke="#A60E22" stroke-width="3" />
      <rect x="294" y="330" width="28" height="28" rx="9" fill="#F9D994" stroke="#503027" stroke-width="4" />
      <rect x="339" y="330" width="28" height="28" rx="9" fill="#F9D994" stroke="#503027" stroke-width="4" />
      <path d="M390 276 H428 L454 296 L441 315 L457 333 L441 351 L457 369 L441 388 L454 409 L428 420 H390 Z" fill="url(#red-wrapper)" stroke="#A60E22" stroke-width="5" stroke-linejoin="round" />
      <path d="M402 284 Q426 300 400 317 Q425 332 402 350 Q425 366 401 384 Q421 400 399 414" fill="none" stroke="#FFF1D7" stroke-width="10" opacity=".92" />
    </g>
  </g>
</svg>