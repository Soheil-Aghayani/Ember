<circle cx="256" cy="253" r="145" fill="url(#waffle)" stroke="#4E281F" stroke-width="10"/>
<path d="M242 230 Q242 219 256 219 Q270 219 270 230 V339 Q270 351 284 351 H291 V375 H220 V351 H228 Q242 351 242 339 Z" fill="url(#chocolate-face)"/>
<circle cx="256" cy="186" r="23" fill="url(#chocolate-face)"/>
<path d="M249 229 Q256 226 263 229" fill="none" stroke="#C78354" stroke-width="4" stroke-linecap="round" opacity=".8"/>
