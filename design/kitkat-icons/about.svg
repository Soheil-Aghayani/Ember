  <stop offset=".5" stop-color="#EF1E32"/>
  <stop offset="1" stop-color="#B90A25"/>
</linearGradient>
<linearGradient id="cream-shine" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFF9E8"/>
  <stop offset="1" stop-color="#F4DDAF"/>
</linearGradient>
<pattern id="waffle" width="18" height="18" patternUnits="userSpaceOnUse">
  <rect width="18" height="18" fill="url(#wafer)"/>
  <path d="M-5 5 L5 -5 M0 18 L18 0 M13 23 L23 13 M-5 13 L5 23 M0 0 L18 18 M13 -5 L23 5"
