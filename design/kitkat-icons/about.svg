  <path d="M-5 6 L6 -5 M0 18 L18 0" fill="none" stroke="#FFF5D9" stroke-width="1" opacity=".72"/>
</pattern>
</defs>
  
  <g id="about" data-name="About">
<ellipse cx="256" cy="444" rx="177" ry="18" fill="#6B3526" opacity=".12"/>
<circle cx="256" cy="253" r="181" fill="url(#chocolate)" stroke="#4A251E" stroke-width="12"/>
