      <stop offset=".28" stop-color="#7D3F29" />
      <stop offset=".72" stop-color="#572A20" />
      <stop offset="1" stop-color="#3E201B" />
    </linearGradient>
    <linearGradient id="chocolate-face" x1="0" y1="0" x2="1" y2="1">
