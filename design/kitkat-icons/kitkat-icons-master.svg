  <title id="title">Ember KitKat editable icon sheet</title>
  <desc id="desc">Six editable icon groups arranged in a 3 by 2 grid. Select groups by name in VectorCraft.</desc>
  <defs>
    <linearGradient id="chocolate" x1="0" y1="0" x2="0" y2="1">
