[package]
name = "ember-ui"
version = "2.0.0"
edition = "2021"

[dependencies]
arboard = { version = "3", default-features = false }
rfd = { version = "0.16", default-features = false }
ember-engine = { path = "../crates/ember-engine" }
ember-win = { path = "../crates/ember-win" }
ember-subs = { path = "../crates/ember-subs" }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"



