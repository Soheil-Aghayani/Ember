  <path d="M1036 1200 C1148 1055 1198 942 1324 903 C1450 864 1533 928 1600 856 L1600 1200Z" fill="#FFC84B" fill-opacity="0.40" />
  <path d="M1230 1200 C1340 1073 1438 1048 1600 1080" fill="none" stroke="url(#cherry)" stroke-width="82" stroke-linecap="round" stroke-opacity="0.44" />
  <path d="M1130 1190 C1267 1058 1402 1021 1592 1034" fill="none" stroke="#FFFDF7" stroke-width="24" stroke-linecap="round" stroke-opacity="0.82" />
  <path d="M150 1120 C270 1032 385 1010 518 1045" fill="none" stroke="url(#aqua)" stroke-width="48" stroke-linecap="round" stroke-opacity="0.24" />

  <!-- Small wrapped sweets: simple, abstract shapes rather than product artwork. -->
  <g transform="translate(1395 365) rotate(22)" opacity="0.76">
