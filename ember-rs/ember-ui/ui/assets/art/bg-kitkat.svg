<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="vanilla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0D1" />
      <stop offset="0.52" stop-color="#FFF8EA" />
      <stop offset="1" stop-color="#F8EFD9" />
    </linearGradient>
    <linearGradient id="cherry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F44E70" />
      <stop offset="1" stop-color="#C9233D" />
    </linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A" />
      <stop offset="1" stop-color="#FFAE38" />
