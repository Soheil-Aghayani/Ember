    <path d="M7 -26 C26 -4 26 4 7 26" fill="none" stroke="#FFDA73" stroke-width="8" stroke-linecap="round" stroke-opacity="0.92" />
  </g>
  <g transform="translate(1385 890) rotate(-20) scale(0.78)" opacity="0.72">
    <path d="M-82 -21 L-126 -48 L-120 1 L-82 18Z" fill="#43B5A6" />
    <path d="M82 -21 L126 -48 L120 1 L82 18Z" fill="#F45B78" />
