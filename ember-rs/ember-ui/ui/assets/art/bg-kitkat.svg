  <rect width="1600" height="1200" fill="url(#vanilla)" />

  <!-- Oversized color fields stay at the edges so the controls remain easy to read. -->
  <path d="M1030 -70 C1215 40 1365 34 1605 0 L1605 312 C1460 346 1320 288 1210 218 C1102 150 1044 88 1030 -70Z" fill="#F45B78" fill-opacity="0.23" />
